<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Paper Curator — GIIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #0b0e14;
    --surface:  #13171f;
    --surface2: #1c2130;
    --border:   #272d3d;
    --accent:   #6c8ef5;
    --accent2:  #a78bfa;
    --text:     #e8ecf5;
    --muted:    #7a82a0;
    --success:  #4ade80;
    --warn:     #fbbf24;
    --danger:   #f87171;
    --radius:   12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 1rem 4rem;
  }

  /* ── Header ── */
  header {
    max-width: 860px;
    margin: 0 auto;
    padding: 3.5rem 0 2.5rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .5rem;
  }

  .badge {
    font-family: 'DM Sans', sans-serif;
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(108,142,245,.12);
    border: 1px solid rgba(108,142,245,.25);
    padding: .25rem .75rem;
    border-radius: 999px;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #e8ecf5 0%, #6c8ef5 60%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 1rem;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.6;
    font-weight: 300;
  }

  /* ── Search box ── */
  .search-wrap {
    max-width: 860px;
    margin: 0 auto 2rem;
  }

  .search-row {
    display: flex;
    gap: .75rem;
    align-items: stretch;
  }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    padding: .85rem 1.2rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,142,245,.15);
  }

  .search-input::placeholder { color: var(--muted); }

  .btn {
    font-family: 'Syne', sans-serif;
    font-size: .9rem;
    font-weight: 600;
    letter-spacing: .03em;
    padding: .85rem 1.6rem;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }

  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-primary:hover:not(:disabled) { opacity: .88; }

  /* Filtros */
  .filters {
    display: flex;
    gap: .75rem;
    margin-top: .75rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .filters label {
    font-size: .82rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .4rem;
  }

  .filters select, .filters input[type=number] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: .82rem;
    padding: .3rem .6rem;
    outline: none;
  }

  .filters select:focus, .filters input[type=number]:focus {
    border-color: var(--accent);
  }

  /* ── Status bar ── */
  #status-bar {
    max-width: 860px;
    margin: 0 auto 1.5rem;
    display: none;
  }

  .status-inner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .75rem 1.2rem;
    font-size: .85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .75rem;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Area summary ── */
  #summary-box {
    max-width: 860px;
    margin: 0 auto 1.5rem;
    display: none;
  }

  .summary-inner {
    background: linear-gradient(135deg, rgba(108,142,245,.08) 0%, rgba(167,139,250,.06) 100%);
    border: 1px solid rgba(108,142,245,.2);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    font-size: .9rem;
    line-height: 1.6;
    font-weight: 300;
    color: var(--text);
    display: flex;
    gap: .75rem;
    align-items: flex-start;
  }

  .summary-icon {
    font-size: 1.1rem;
    flex-shrink: 0;
    margin-top: .1rem;
  }

  .mode-pill {
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .15rem .55rem;
    border-radius: 999px;
    margin-left: .5rem;
    vertical-align: middle;
  }

  .mode-llm  { background: rgba(74,222,128,.12); color: var(--success); border: 1px solid rgba(74,222,128,.25); }
  .mode-local { background: rgba(251,191,36,.1); color: var(--warn); border: 1px solid rgba(251,191,36,.25); }

  /* ── Results grid ── */
  #results {
    max-width: 860px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    transition: border-color .2s, transform .15s;
    animation: fadeUp .35s ease both;
  }

  .card:hover {
    border-color: rgba(108,142,245,.35);
    transform: translateY(-1px);
  }

  .card.priority {
    border-color: rgba(108,142,245,.4);
    background: linear-gradient(135deg, rgba(108,142,245,.06) 0%, var(--surface) 60%);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: .6rem;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    text-decoration: none;
    transition: color .15s;
  }

  .card-title:hover { color: var(--accent); }

  .score-badge {
    font-family: 'Syne', sans-serif;
    font-size: .82rem;
    font-weight: 700;
    min-width: 44px;
    text-align: center;
    padding: .2rem .55rem;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .score-high   { background: rgba(74,222,128,.12);  color: var(--success); border: 1px solid rgba(74,222,128,.2); }
  .score-medium { background: rgba(251,191,36,.1);   color: var(--warn);    border: 1px solid rgba(251,191,36,.2); }
  .score-low    { background: rgba(248,113,113,.1);  color: var(--danger);  border: 1px solid rgba(248,113,113,.2); }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem .75rem;
    font-size: .78rem;
    color: var(--muted);
    margin-bottom: .75rem;
    align-items: center;
  }

  .card-meta span { display: flex; align-items: center; gap: .25rem; }

  .tag {
    font-size: .7rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: .15rem .5rem;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .tag-priority {
    background: rgba(108,142,245,.12);
    color: var(--accent);
    border-color: rgba(108,142,245,.25);
  }

  .card-contrib {
    font-size: .88rem;
    line-height: 1.55;
    color: var(--text);
    font-weight: 300;
    margin-bottom: .75rem;
  }

  .card-abstract {
    font-size: .8rem;
    line-height: 1.6;
    color: var(--muted);
    font-style: italic;
    border-left: 2px solid var(--border);
    padding-left: .75rem;
    margin-bottom: .75rem;
    display: none;
  }

  .card-abstract.visible { display: block; }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: .5rem;
    flex-wrap: wrap;
  }

  .btn-sm {
    font-size: .78rem;
    font-weight: 500;
    padding: .35rem .85rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, color .15s;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .btn-link {
    font-size: .78rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: .3rem;
  }

  .btn-link:hover { text-decoration: underline; }

  /* ── Empty / Error states ── */
  .state-box {
    max-width: 860px;
    margin: 0 auto;
    text-align: center;
    padding: 3rem 1rem;
    display: none;
  }

  .state-box .icon { font-size: 2.5rem; margin-bottom: .75rem; }
  .state-box h3 { font-family: 'Syne', sans-serif; font-size: 1.1rem; margin-bottom: .4rem; }
  .state-box p { font-size: .88rem; color: var(--muted); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <span class="badge">GIIA — Curador Acadêmico</span>
  <h1>Paper Curator</h1>
  <p>Busca artigos científicos em tempo real e usa IA pra ranquear o que é mais relevante pro seu tema.</p>
</header>

<div class="search-wrap">
  <div class="search-row">
    <input
      class="search-input"
      id="search-input"
      type="text"
      placeholder="Ex: contrastive learning para NLP, transformers para séries temporais..."
      autocomplete="off"
    />
    <button class="btn btn-primary" id="search-btn" onclick="buscar()">Buscar</button>
  </div>
  <div class="filters">
    <label>
      A partir de:
      <input type="number" id="year-from" min="1990" max="2025" placeholder="2020" style="width:80px"/>
    </label>
    <label>
      Resultados:
      <select id="limit-select">
        <option value="8">8 artigos</option>
        <option value="12" selected>12 artigos</option>
        <option value="16">16 artigos</option>
      </select>
    </label>
  </div>
</div>

<div id="status-bar">
  <div class="status-inner">
    <div class="spinner" id="spinner"></div>
    <span id="status-text">Buscando artigos...</span>
  </div>
</div>

<div id="summary-box">
  <div class="summary-inner">
    <span class="summary-icon">🔬</span>
    <div id="summary-text"></div>
  </div>
</div>

<div id="results"></div>

<div class="state-box" id="empty-state">
  <div class="icon">🔍</div>
  <h3>Nenhum artigo encontrado</h3>
  <p>Tente usar termos em inglês ou um tema mais amplo.</p>
</div>

<div class="state-box" id="error-state">
  <div class="icon">⚠️</div>
  <h3>Erro ao buscar</h3>
  <p id="error-msg"></p>
</div>

<script>
const API = 'http://localhost:8000';

async function buscar() {
  const tema = document.getElementById('search-input').value.trim();
  if (!tema) return;

  const yearFrom = document.getElementById('year-from').value;
  const limit = document.getElementById('limit-select').value;

  setLoading(true);
  hideAll();

  try {
    const res = await fetch(`${API}/buscar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tema,
        year_from: yearFrom ? parseInt(yearFrom) : null,
        limit: parseInt(limit),
      }),
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Erro desconhecido');
    }

    const data = await res.json();
    renderResults(data);

  } catch (e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function renderResults(data) {
  const container = document.getElementById('results');
  container.innerHTML = '';

  if (!data.resultados || data.resultados.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    return;
  }

  // Summary
  const summaryBox = document.getElementById('summary-box');
  const summaryText = document.getElementById('summary-text');
  const modePill = data.modo === 'llm'
    ? '<span class="mode-pill mode-llm">IA ativa</span>'
    : '<span class="mode-pill mode-local">modo offline</span>';

  summaryText.innerHTML = `<strong>${data.total_encontrado} artigos encontrados</strong>${modePill}<br/>${data.resumo_area || ''}`;
  summaryBox.style.display = 'block';

  data.resultados.forEach((r, i) => {
    const card = buildCard(r, i);
    container.appendChild(card);
  });
}

function buildCard(r, index) {
  const card = document.createElement('div');
  card.className = 'card' + (r.leia_primeiro ? ' priority' : '');
  card.style.animationDelay = `${index * 0.06}s`;

  const score = parseFloat(r.relevancia);
  const scoreClass = score >= 7 ? 'score-high' : score >= 4 ? 'score-medium' : 'score-low';

  const autores = Array.isArray(r.autores) && r.autores.length > 0
    ? r.autores.join(', ') + (r.autores.length >= 3 ? ' et al.' : '')
    : 'Autores não disponíveis';

  const citacoes = r.citacoes != null ? `${r.citacoes} citações` : '';
  const ano = r.ano ? `${r.ano}` : '';
  const fonte = r.fonte || '';

  const priorityTag = r.leia_primeiro
    ? '<span class="tag tag-priority">⭐ leia primeiro</span>'
    : '';

  const tipoTag = r.tipo && r.tipo !== 'desconhecido'
    ? `<span class="tag">${r.tipo}</span>`
    : '';

  const contrib = r.contribuicao && r.contribuicao !== 'Ranking por similaridade semântica (modo offline)'
    ? `<p class="card-contrib">${r.contribuicao}</p>`
    : '';

  const abstract = r.abstract
    ? `<p class="card-abstract" id="abstract-${index}">${r.abstract}</p>`
    : '';

  const abstractBtn = r.abstract
    ? `<button class="btn-sm" onclick="toggleAbstract(${index}, this)">Ver abstract</button>`
    : '';

  const linkBtn = r.url
    ? `<a class="btn-link" href="${r.url}" target="_blank">Abrir artigo ↗</a>`
    : '';

  card.innerHTML = `
    <div class="card-header">
      <a class="card-title" href="${r.url || '#'}" target="_blank">${r.titulo || 'Título não disponível'}</a>
      <span class="score-badge ${scoreClass}">${score.toFixed(1)}</span>
    </div>
    <div class="card-meta">
      ${ano ? `<span>📅 ${ano}</span>` : ''}
      ${autores ? `<span>👤 ${autores}</span>` : ''}
      ${citacoes ? `<span>📖 ${citacoes}</span>` : ''}
      ${fonte ? `<span>🔗 ${fonte}</span>` : ''}
      ${priorityTag}
      ${tipoTag}
    </div>
    ${contrib}
    ${abstract}
    <div class="card-footer">
      <div style="display:flex;gap:.5rem">
        ${abstractBtn}
      </div>
      ${linkBtn}
    </div>
  `;

  return card;
}

function toggleAbstract(index, btn) {
  const el = document.getElementById(`abstract-${index}`);
  if (!el) return;
  const visible = el.classList.toggle('visible');
  btn.textContent = visible ? 'Ocultar abstract' : 'Ver abstract';
}

function setLoading(on) {
  const btn = document.getElementById('search-btn');
  const bar = document.getElementById('status-bar');
  btn.disabled = on;
  btn.textContent = on ? 'Buscando...' : 'Buscar';
  bar.style.display = on ? 'block' : 'none';
}

function hideAll() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('summary-box').style.display = 'none';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('error-state').style.display = 'none';
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('error-state').style.display = 'block';
}

// Enter para buscar
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscar();
});
</script>
</body>
</html>
